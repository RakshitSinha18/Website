<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RS monogram">
  <defs>
    <!-- Sky -> amber accent, matching the site's spotlight gradient -->
    <linearGradient id="rs-accent" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <!-- Subtle vertical sheen on the dark tile -->
    <linearGradient id="rs-bg" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141a2b"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#rs-bg)"/>
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- RS monogram -->
  <text x="128" y="128" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="120" font-weight="700" letter-spacing="-4"
        fill="url(#rs-accent)">RS</text>
</svg>
